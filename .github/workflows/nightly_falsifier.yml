name: Nightly falsifier (Path C Routine, GitHub Actions edition)

# PhF-5: the repo's answer to Boris Cherny's "no one has cracked server-side
# Routines yet" (2026-04-21 kickoff). Managed Agents + Routines went GA on
# 2026-04-08; a native Routine driver would replace this workflow's core
# with a one-line swap via `run_path_c_routine`'s `invoke_fn` hook. Until
# the native API is stable in a form we can cite, GitHub Actions cron is
# the "lives-past-your-laptop" demonstration.
#
# Each nightly run:
#   1. Rebuilds the rejection log (reflects any new results/ JSON landing).
#   2. Runs `make prereg-validate` + `make prereg-audit` so the tamper-
#      evidence audit chain stays machine-verifiable.
#   3. (optional, gated on ANTHROPIC_API_KEY) fires one Path B / Path C
#      iteration of the falsification gate against a watched-dir trigger.
#
# The workflow is inert on PRs and forks — scheduled runs happen only on
# the main branch of the source repo.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (02:00 US-East, 15:00 KST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-falsifier
  cancel-in-progress: false

jobs:
  falsifier:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install lifelines  # for PFS replay side-experiments

      - name: Re-render rejection log
        id: render_rejection_log
        run: |
          set -o pipefail
          python src/render_rejection_log.py 2>&1 | tee /tmp/rejection_log_render.log

      - name: Validate pre-registrations (tamper-evidence chain)
        id: prereg_validate
        run: |
          set -o pipefail
          python src/preregistration.py validate --dir preregistrations 2>&1 | tee /tmp/prereg_validate.log

      - name: Audit pre-reg commit SHAs
        id: prereg_audit
        run: |
          python src/preregistration.py audit --dir preregistrations \
            > /tmp/prereg_audit.json
          head -20 /tmp/prereg_audit.json

      - name: Falsification gate — Path C one-shot (gated on API key)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Single-shot Path C invocation. `invoke_fn` defaults to Path B.
          python -c "
          from lacuna.managed_agent_runner import run_path_c_routine
          out = run_path_c_routine(
              night=3,
              interval_seconds=0,
              max_iterations=1,
              watch_dir=None,
              log_path='results/routine/verdicts.jsonl',
              invoke_fn=lambda n: {'session_id':'ga-dry','status':'completed','output':'nightly ok'},
          )
          print('nightly result:', out)
          "

      - name: Post result as GitHub issue comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcomes = {
              render: '${{ steps.render_rejection_log.outcome }}',
              validate: '${{ steps.prereg_validate.outcome }}',
              audit: '${{ steps.prereg_audit.outcome }}',
            };
            const statusLabel = (value) => {
              if (value === 'success') return 'OK';
              if (value === 'skipped') return 'SKIPPED';
              return (value || 'unknown').toUpperCase();
            };
            const readIfExists = (path) =>
              fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const audit = readIfExists('/tmp/prereg_audit.json') || '(no audit output)';
            const validateLog = readIfExists('/tmp/prereg_validate.log').trim();
            const formatAudit = (raw) => {
              if (outcomes.audit !== 'success') return raw.slice(0, 4000);
              try {
                const rows = JSON.parse(raw);
                if (Array.isArray(rows) && rows.length > 20) {
                  return JSON.stringify([
                    ...rows.slice(0, 20),
                    { omitted_rows: rows.length - 20 },
                  ], null, 2);
                }
                return JSON.stringify(rows, null, 2);
              } catch {
                return raw.slice(0, 4000);
              }
            };
            const auditBlock = formatAudit(audit);
            const bodyParts = [
              '### Nightly Falsifier — ' + new Date().toISOString(),
              '',
              '- Rejection log re-rendered: ' + statusLabel(outcomes.render),
              '- Pre-reg validate: ' + statusLabel(outcomes.validate),
              '- Pre-reg audit: ' + statusLabel(outcomes.audit),
              '',
              'Pre-reg audit (first-committed SHA + content hash per YAML):',
              '',
              outcomes.audit === 'success' ? '```json' : '```text',
              auditBlock,
              '```',
              '',
              'Run ID: ' + context.runId,
              'Run: https://github.com/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId
            ];
            if (outcomes.validate !== 'success' && validateLog) {
              bodyParts.push(
                '',
                'Pre-reg validate log:',
                '',
                '```text',
                validateLog.slice(-4000),
                '```',
              );
            }
            const body = bodyParts.join('\n');
            // Create or update a pinned "Nightly Falsifier" issue.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly-falsifier', per_page: 5,
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Nightly Falsifier — Path C verdict log',
                body,
                labels: ['nightly-falsifier'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            }
